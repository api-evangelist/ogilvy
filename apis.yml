  - type: NoDeveloperPortal
    title: >-
      No developer portal, REST APIs, OpenAPI, SDKs, CLI, webhooks, status page,
      changelog, or public pricing. Re-probed 2026-08-12 — every /.well-known/ path
      on www.ogilvy.com, api.ogilvy.com and www.ogilvyhealth.com returned 404.
  - type: NoGitHubOrg
    title: >-
      No Ogilvy engineering organization on GitHub. github.com/Ogilvy is a USER
      account with zero public repositories (HTTP 200, corrects an earlier 404 note).
  - type: NoRSS
    title: >-
      No RSS/Atom feed. /rss.xml, /ideas/rss.xml and /ideas/feed all 404, and /feed
      soft-200s with the human /ideas HTML page rather than a feed document.
  - type: NoAPIHost
    title: >-
      api.ogilvy.com resolves (Azure Traffic Manager -> nginx) but returns HTTP 404
      on every path including the root — an internal/legacy host, not a public API.
