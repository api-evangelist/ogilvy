note: >-
  Every /.well-known/ path probed on every Ogilvy host returned HTTP 404. On
  www.ogilvy.com the body is the Drupal theme's 404 page (~84 KB of HTML) served
  with a real 404 status — not a soft-200 — and on api.ogilvy.com it is a bare
  nginx 404. No well-known document is served anywhere. Recorded as an absence:
  NO WellKnown and NO SecurityTxt pointer is emitted in apis.yml, because either
  pointer would assert that Ogilvy publishes a discovery surface it does not.
  Ogilvy DOES publish a Responsible Disclosure Policy as an HTML page — see
  security/ogilvy-vulnerability-disclosure.yml — but it is not advertised via
  RFC 9116 security.txt.
