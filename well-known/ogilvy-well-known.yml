drupal_surface:
  note: >-
    www.ogilvy.com runs Drupal (confirmed by /core/misc/drupal.js, HTTP 200). The
    Drupal REST/JSON:API modules expose NO public resources: /jsonapi and
    /jsonapi/node/article 404, and the REST router answers /node?_format=json with
    a JSON routing error rather than content. The only 200-returning machine-readable
    endpoints are site-internal plumbing, not an API product.
  probes:
    - path: /jsonapi/
      status: 404
    - path: /jsonapi/node/article
      status: 404
    - path: /router/translate-path
      status: 404
    - path: /entity/node
      status: 404
    - path: /oauth/token
      status: 404
    - path: /node?_format=json
      status: 404
      content_type: application/json
      body: '{"message":"No route found for \"GET https://www.ogilvy.com/node\""}'
      note: >-
        Drupal REST routing is loaded but no entity resource is published. The
        JSON error body is the only evidence the REST layer exists at all.
    - path: /session/token
      status: 200
      content_type: text/plain
      note: >-
        Drupal's CSRF token endpoint. Site-internal plumbing required by the
        theme's own JavaScript — not an API resource, not documented, not usable
        by a third party.
    - path: /check-geo-country
      status: 200
      content_type: application/json
      body: '{"geo_country":"us"}'
      note: >-
        Single-purpose geo-routing helper the site calls from its own front-end
        (visible in the served HTML). Machine-readable but not a published API:
        no documentation, no versioning, no contract, one field.
    - path: /core/misc/drupal.js
      status: 200
      note: Drupal core asset — the platform fingerprint.
    - path: /robots.txt
      status: 200
      note: Stock Drupal robots.txt; nothing developer-related disallowed.
    - path: /sitemap.xml
      status: 200
      note: 1,535 URLs, all marketing/editorial. No developer, API or docs path.
    - path: /feed
      status: 200
      content_type: text/html
      note: >-
        SOFT 200 — returns the human /ideas HTML page, not an RSS/Atom document.
        /rss.xml, /ideas/rss.xml and /ideas/feed all 404. Ogilvy publishes no feed.
